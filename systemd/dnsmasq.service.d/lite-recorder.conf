[Unit]
# lite-recorder-ap.service only orders itself before hostapd.service and
# dnsmasq.service, not those two relative to each other, so systemd starts
# them in parallel. On some drivers hostapd briefly toggles the interface
# while switching it into AP mode; if dnsmasq queries the interface list
# during that window it fails with "unknown interface" and dies, leaving
# clients associated at L2 but with no DHCP server to hand out an IP.
After=hostapd.service
Requires=hostapd.service
